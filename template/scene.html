<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}svg{display:block}</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../../.claude/skills/antiks-stories/assets/lib/antiks.js"></script>
<script>
/* TEMPLATE scene — replace the beats with the storyboard. Time everything from timings.json:
   L(i) = line i {start,end}; W(text) = first word whose text starts with `text` (for precise hits). */
const A = Antiks;
let T, cam, hero, host, caps, hook, photo, rewind, cover;
const L = i => T.lines[i];
const W = (txt, from = 0) => T.words.find(w => w.start >= from && w.w.replace(/\W/g, '').toLowerCase().startsWith(txt.toLowerCase()));

window.setup = function (cfg) {
  T = cfg.timings;
  const svg = A.svg();
  // world (moves with camera)
  cam = A.camera(svg);
  A.bg.jungle(cam.g, 5);
  hero = A.doodle(cam.g, { shirt: '#9c8a58', pants: '#6f6040', outfit: 'uniform', hat: 'fieldcap', prop: 'rifle', stubble: true });
  A.bg.jungleFront(cam.g);
  // overlays (fixed to screen)
  photo = A.archive(svg, { label: 'REAL PHOTO HERE', caption: 'LUBANG, 1974', credit: 'Source: ...', x: 680, y: 820, w: 440, h: 420, tilt: 6 });
  host = A.host(svg);
  caps = A.captions(svg, T.words, { y: 430 });
  hook = A.title(svg, ['THE WAR ENDED IN 1945.', { text: 'HE KEPT FIGHTING.', color: A.GOLD }], { y: 360, size: 70 });
  rewind = A.fx.rewind(svg, '1944');
  A.fx.vignette(svg, 0.6);
  cover = A.fx.cover(svg, '#000');
  window.DURATION = T.duration + 1.5;
};

window.renderFrame = function (t) {
  const end = window.DURATION;
  // camera: slow push-in, snap closer on the last line
  cam.set(t, [
    { t: 0, x: 540, y: 1000, zoom: 1.0 },
    { t: L(1).start, x: 540, y: 980, zoom: 1.08 },
    { t: L(2).start + 0.15, x: 560, y: 1000, zoom: 1.25, ease: 'out' },
    { t: end, x: 560, y: 1000, zoom: 1.3 }
  ], [{ t: L(2).start, amp: 14, dur: 0.4 }]);
  hero.set({ x: 540, y: 1150, s: 1.5, t, face: t < L(2).start ? 'determined' : 'shocked', arms: 'hold' });

  // host pops in bottom-left for the reveal, cap gag
  const pop = A.popIn(t, L(2).start - 0.2);
  const r = A.hostReact(t, [{ t: 0, pose: 'smug' }, { t: L(2).start, pose: 'shocked' }]);
  host.set({ x: 190, y: 1230, s: 0.5 * pop, t, pose: r.pose, lift: r.lift, tilt: r.tilt });

  photo.set(t, L(1).start + 0.3, L(2).start - 0.1);
  rewind.set(t, L(1).start - 0.25, L(1).start + 0.35);
  hook.set(t, 0, L(0).end);
  caps.set(t, t < L(0).end);           // hide captions while the hook title shows
  cover.set(1 - A.clamp(t / 0.15));    // tiny fade from black at the start
};
</script>
</body></html>
